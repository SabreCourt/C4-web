<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Partie en ligne – Puissance 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.95" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js" integrity="sha384-tsWbtKpLfuzjlGIIXe0rsRS6r5E5cz3OTigUJ8cHNnBydhDEjOCS0WDnsxWx/2Y1" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 30%, #1b2735, #090a0f 80%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f4f8;
    }
    .container {
      width: 95%;
      max-width: 760px;
      padding: 32px;
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .color-badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.12);
    }
    .color-badge.rouge {
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.4);
    }
    .color-badge.jaune {
      color: #f4a261;
      border: 1px solid rgba(244, 162, 97, 0.4);
    }
    #status {
      margin-bottom: 20px;
      font-size: 1rem;
      color: rgba(240, 244, 248, 0.9);
      min-height: 24px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, minmax(60px, 1fr));
      gap: 10px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: inset 0 8px 26px rgba(0,0,0,0.45);
    }
    .cell {
      width: 100%;
      padding-top: 100%;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9), 0 6px 18px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .cell::after {
      content: '';
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      background: transparent;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .cell:hover {
      transform: translateY(-4px);
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.85), 0 8px 20px rgba(30,144,255,0.18);
    }
    .cell.rouge::after {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #e63946 65%);
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.45);
    }
    .cell.jaune::after {
      background: radial-gradient(circle at 35% 30%, #ffd19a, #f4a261 65%);
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.45);
    }
    .cell.disabled {
      cursor: default;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9), 0 3px 10px rgba(0,0,0,0.25);
    }
    .actions {
      margin-top: 26px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .actions button, .actions a {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    #leave {
      background: linear-gradient(90deg, #ff5f6d, #ffc371);
      color: #1b2735;
    }
    #leave:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    a.back {
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      color: rgba(240,244,248,0.9);
    }
    a.back:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    .opponent {
      font-size: 0.95rem;
      color: rgba(240,244,248,0.75);
    }
    @media (max-width: 640px) {
      .board {
        gap: 8px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Bonjour {{ pseudo }}</h1>
        <div class="opponent" id="opponent"></div>
      </div>
      <div class="info">
        <span>Votre couleur :</span>
        <span class="color-badge" id="color-badge">?</span>
      </div>
    </header>
    <div id="status">Connexion en cours…</div>
    <div class="board" id="board"></div>
    <div class="actions">
      <button id="leave">Quitter la partie</button>
      <a href="/lobby_multi" class="back">Retour au lobby</a>
    </div>
  </div>

  <script>
    const pseudo = {{ pseudo|tojson }};
    const roomId = {{ room_id|tojson }};
    const ROWS = 6;
    const COLS = 7;

    const socket = io();
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const opponentEl = document.getElementById('opponent');
    const colorBadge = document.getElementById('color-badge');
    const leaveBtn = document.getElementById('leave');

    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let myColor = null;
    let myTurn = false;
    let gameFinished = false;
    let opponent = null;

    function buildBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell disabled';
          cell.dataset.col = col;
          boardEl.appendChild(cell);
        }
      }
    }

    function syncBoard(newBoard) {
      board = newBoard.map(row => row.slice());
    }

    function renderBoard() {
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(cell => {
        cell.classList.remove('rouge', 'jaune');
        if (!myTurn || gameFinished) {
          cell.classList.add('disabled');
        } else {
          cell.classList.remove('disabled');
        }
      });
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const token = board[row][col];
          if (token === 0) continue;
          const idx = row * COLS + col;
          const cell = boardEl.children[idx];
          cell.classList.add(token === 1 ? 'rouge' : 'jaune');
        }
      }
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function updateColorBadge() {
      colorBadge.textContent = myColor ? (myColor === 'rouge' ? 'Rouge' : 'Jaune') : '?';
      colorBadge.className = `color-badge ${myColor || ''}`.trim();
    }

    boardEl.addEventListener('click', (event) => {
      if (!myTurn || gameFinished) return;
      const target = event.target.closest('.cell');
      if (!target) return;
      const column = Number(target.dataset.col);
      socket.emit('play_move', { room_id: roomId, column });
    });

    socket.on('connect', () => {
      socket.emit('pseudo', pseudo, () => {
        socket.emit('register_player', { room_id: roomId });
      });
    });

    socket.on('waiting_player', (data) => {
      myColor = data.color;
      opponent = null;
      opponentEl.textContent = 'En attente d\'un adversaire…';
      syncBoard(data.board || board);
      myTurn = false;
      gameFinished = false;
      updateColorBadge();
      updateStatus("En attente d'un adversaire…");
      renderBoard();
    });

    socket.on('game_start', (data) => {
      myColor = data.color;
      opponent = data.opponent;
      opponentEl.textContent = `Adversaire : ${opponent}`;
      syncBoard(data.board || board);
      myTurn = !!data.your_turn;
      gameFinished = false;
      updateColorBadge();
      updateStatus(myTurn ? 'À vous de jouer !' : `Tour de ${opponent}…`);
      renderBoard();
    });

    socket.on('move_played', (data) => {
      syncBoard(data.board || board);
      if (data.winner) {
        gameFinished = true;
        myTurn = false;
        const victory = data.winner === pseudo;
        updateStatus(victory ? '🎉 Vous gagnez la partie !' : `😢 ${data.winner} remporte la partie.`);
      } else if (data.draw) {
        gameFinished = true;
        myTurn = false;
        updateStatus('🤝 Match nul !');
      } else {
        myTurn = data.next_turn === pseudo;
        updateStatus(myTurn ? 'À vous de jouer !' : `Tour de ${data.next_turn}…`);
      }
      renderBoard();
    });

    socket.on('move_rejected', (data) => {
      if (data.message === 'column_full') {
        updateStatus('Cette colonne est pleine. Essayez une autre.');
      } else if (data.message === 'not_your_turn') {
        updateStatus("Patientez, c'est au tour de votre adversaire.");
      }
    });

    socket.on('room_error', (data) => {
      const reason = data && data.message ? data.message : 'Erreur inattendue.';
      updateStatus(`Erreur : ${reason}`);
      setTimeout(() => {
        socket.emit('leave_multiplayer', { room_id: roomId });
      }, 1500);
    });

    socket.on('opponent_left', (data) => {
      const name = data && data.pseudo ? data.pseudo : 'Votre adversaire';
      updateStatus(`${name} a quitté la partie.`);
      gameFinished = true;
      myTurn = false;
      renderBoard();
    });

    socket.on('left_room', () => {
      socket.disconnect();
      window.location.href = '/lobby_multi';
    });

    leaveBtn.addEventListener('click', () => {
      socket.emit('leave_multiplayer', { room_id: roomId });
    });

    window.addEventListener('beforeunload', () => {
      socket.emit('leave_multiplayer', { room_id: roomId });
    });

    buildBoard();
    renderBoard();
  </script>
</body>
</html>
