<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion – Neo Arcade Hub</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neo-arcade.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="neo-arcade-page auth-page theme-puissance4">
  <main class="auth-shell" role="main">
    <div class="auth-brand">
      <h1 class="auth-brand__title">Neo Arcade Hub</h1>
      <p class="auth-brand__subtitle">Rejoins l'arcade futuriste pour défier l'IA ou tes amis en ligne.</p>
    </div>

    <section class="auth-card" aria-labelledby="tab-login">
      <div class="auth-tabs" role="tablist" aria-label="Modes de connexion">
        <button type="button" id="tab-login" class="auth-tab is-active" data-mode="login" role="tab" aria-selected="true">Se connecter</button>
        <button type="button" id="tab-register" class="auth-tab" data-mode="register" role="tab" aria-selected="false">Créer un compte</button>
      </div>

      <div
        id="messages"
        class="auth-message{% if initial_status %} {{ initial_status }}{% endif %}"
        role="status"
        data-message="{{ initial_message|default('', true) }}"
        data-status="{{ initial_status|default('', true) }}"
      >{% if initial_message %}{{ initial_message }}{% endif %}</div>

      <form id="auth-form" class="auth-form" onsubmit="return false;">
        <label class="auth-field" for="username">
          <span>Nom d'utilisateur</span>
          <input type="text" id="username" name="username" class="auth-input" autocomplete="username" required />
        </label>

        <div class="auth-field is-hidden" id="field-email">
          <label for="email">
            <span>Adresse email</span>
            <input type="email" id="email" name="email" class="auth-input" autocomplete="email" />
          </label>
        </div>

        <label class="auth-field" for="password">
          <span>Mot de passe</span>
          <input type="password" id="password" name="password" class="auth-input" autocomplete="current-password" required />
        </label>

        <div class="auth-field is-hidden" id="field-password2">
          <label for="password2">
            <span>Confirmer le mot de passe</span>
            <input type="password" id="password2" name="password2" class="auth-input" autocomplete="new-password" />
          </label>
        </div>

        <button id="submit-btn" class="neo-button primary auth-submit" type="submit">Se connecter</button>
      </form>

      <div class="auth-aux">
        <a href="/forgot_password" id="forgot-link">Mot de passe oublié&nbsp;?</a>
      </div>

      {% if pseudos %}
      <aside class="auth-recent" aria-label="Pseudos récents">
        <p class="auth-recent__title">Dernières connexions</p>
        <ul class="auth-recent__list">
          {% for p in pseudos %}
          <li class="auth-recent__item">{{ p }}</li>
          {% endfor %}
        </ul>
      </aside>
      {% endif %}
    </section>
  </main>

  <script>
    const tabLogin = document.querySelector('[data-mode="login"]');
    const tabRegister = document.querySelector('[data-mode="register"]');
    const tabs = [tabLogin, tabRegister];
    const emailField = document.getElementById('field-email');
    const emailInput = document.getElementById('email');
    const passwordField = document.getElementById('password');
    const password2Wrapper = document.getElementById('field-password2');
    const password2Input = document.getElementById('password2');
    const submitBtn = document.getElementById('submit-btn');
    const messages = document.getElementById('messages');

    const initialMessage = messages.dataset.message;
    const initialStatus = messages.dataset.status;
    if (initialMessage) {
      messages.textContent = initialMessage;
      messages.className = `auth-message ${initialStatus || ''}`.trim();
    }

    function setMode(mode) {
      const isLogin = mode === 'login';
      tabs.forEach(tab => {
        const active = tab.dataset.mode === mode;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', active.toString());
      });

      emailField.classList.toggle('is-hidden', isLogin);
      password2Wrapper.classList.toggle('is-hidden', isLogin);
      if (isLogin) {
        emailInput.value = '';
        password2Input.value = '';
        passwordField.setAttribute('autocomplete', 'current-password');
        submitBtn.textContent = 'Se connecter';
      } else {
        passwordField.setAttribute('autocomplete', 'new-password');
        submitBtn.textContent = 'Créer le compte';
      }

      messages.textContent = '';
      messages.className = 'auth-message';
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    document.getElementById('auth-form').addEventListener('submit', async event => {
      event.preventDefault();
      const mode = tabRegister.classList.contains('is-active') ? 'register' : 'login';
      const username = document.getElementById('username').value.trim();
      const email = emailInput.value.trim();
      const password = document.getElementById('password').value;
      const password2 = password2Input.value;

      if (!username || !password || (mode === 'register' && !email)) {
        messages.textContent = 'Veuillez remplir tous les champs obligatoires.';
        messages.className = 'auth-message error';
        return;
      }

      if (mode === 'register' && password !== password2) {
        messages.textContent = 'Les mots de passe ne correspondent pas.';
        messages.className = 'auth-message error';
        return;
      }

      const payload = { username, password };
      if (mode === 'register') {
        payload.password2 = password2;
        payload.email = email;
      }

      const endpoint = mode === 'register' ? '/register' : '/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (response.ok && data.ok) {
          messages.textContent = 'Succès — redirection...';
          messages.className = 'auth-message success';
          window.location.href = '/menu';
        } else {
          let error = data && data.error ? data.error : 'Erreur inconnue';
          if (error === 'pseudo_taken') error = "Nom d'utilisateur déjà pris.";
          else if (error === 'email_taken') error = 'Adresse email déjà utilisée.';
          else if (error === 'invalid_email') error = 'Veuillez saisir une adresse email valide.';
          else if (error === 'invalid_credentials') error = "Nom d'utilisateur ou mot de passe invalide.";
          else if (error === 'password_mismatch') error = 'Les mots de passe ne correspondent pas.';
          else if (error === 'missing_fields') error = 'Champs manquants.';

          messages.textContent = error;
          messages.className = 'auth-message error';
        }
      } catch (error) {
        console.error(error);
        messages.textContent = 'Erreur réseau.';
        messages.className = 'auth-message error';
      }
    });
  </script>
</body>
</html>
