<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié – Neo Arcade Hub</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neo-arcade.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="neo-arcade-page auth-page theme-puissance4">
  <main class="auth-shell" role="main">
    <div class="auth-brand">
      <h1 class="auth-brand__title">Mot de passe oublié</h1>
      <p class="auth-brand__subtitle">Renseigne ton adresse email pour recevoir un lien sécurisé de réinitialisation.</p>
    </div>

    <section class="auth-card">
      <div
        id="status-message"
        class="auth-message{% if status %} {{ status }}{% endif %}"
        role="status"
      >{% if message %}{{ message }}{% endif %}</div>

      <form method="post" class="auth-form">
        <label class="auth-field" for="email">
          <span>Adresse email</span>
          <input type="email" id="email" name="email" class="auth-input" autocomplete="email" required />
        </label>
        <button type="submit" class="neo-button primary auth-submit">Envoyer le lien</button>
      </form>

      <div class="auth-actions">
        <a class="neo-button tertiary" href="/">Retour à la connexion</a>
      </div>
    </section>
  </main>
</body>
</html>
