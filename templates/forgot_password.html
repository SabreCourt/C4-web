<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié – Puissance 4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 30%, #1b2735, #090a0f 80%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f4f8;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    input[type="email"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: white;
      outline: none;
      transition: 0.2s ease;
    }

    input[type="email"]:focus {
      border-color: #1E90FF;
      background: rgba(255, 255, 255, 0.08);
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      color: #031427;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .note {
      font-size: 0.9rem;
      margin-top: 0.5rem;
      color: #ddd;
      min-height: 1.2rem;
    }

    .error { color: #ffb3b3; }
    .success { color: #b6ffb6; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .link-button {
      display: inline-block;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      color: #cde0ff;
      transition: background 0.2s ease;
    }

    .link-button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 480px) {
      .container { margin: 20px; padding: 24px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mot de passe oublié</h1>
    <p>Indiquez votre adresse email pour recevoir un lien de réinitialisation.</p>

    <div class="note{% if status %} {{ status }}{% endif %}">
      {% if message %}{{ message }}{% endif %}
    </div>

    <form method="post">
      <input type="email" name="email" placeholder="Adresse email" required>
      <button type="submit">Envoyer le lien</button>
    </form>

    <div class="actions">
      <a class="link-button" href="/">Retour à la connexion</a>
    </div>
  </div>
</body>
</html>
