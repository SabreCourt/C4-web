<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendu</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neo-arcade.css') }}" />
</head>
<body class="neo-arcade-page page-pendu theme-pendu">
  <div class="portal-transition" id="portal"></div>
  <header class="game-header neo-glass">
    <a class="game-header__brand" data-portal-link href="{{ url_for('menu') }}">⬅️ Hub</a>
    <div class="game-header__meta">
      <h1>Pendu</h1>
      <p>Devine le mot avant la fin.</p>
    </div>
    <div class="game-header__actions">
      <button type="button" class="neo-button primary" id="new-game">Nouvelle partie</button>
      <a class="neo-button secondary" data-portal-link href="{{ url_for('profile') }}">Profil</a>
    </div>
  </header>

  <main class="game-main">
    <div class="game-wrapper">
      <section class="column">
        <div class="header">
          <h1>jeu du pendu</h1>
          <div class="score">Série : <span id="pendu-score">0</span></div>
          <div class="attempts">Essais restants : <span id="pendu-attempts">0</span></div>
        </div>

        <div class="word-display" id="pendu-word">_ _ _ _</div>
        <div class="letters-panel">
          <h2>Lettres testées</h2>
          <div class="letters-grid" id="letters-grid"></div>
        </div>
      </section>

      <section class="column">
        <div class="input-card">
          <label for="guess-input">Propose une nouvelle lettre</label>
          <form id="guess-form" autocomplete="off">
            <div class="input-group">
              <input id="guess-input" name="letter" maxlength="1" autocomplete="off" autofocus required />
              <button type="submit" class="neo-button primary">Valider</button>
            </div>
          </form>
          <p class="message" id="pendu-message" aria-live="polite"></p>
          <p id="pendu-status" class="status-banner" aria-live="assertive"></p>
        </div>

        <div class="hangman-container">
          <svg class="hangman-svg" viewBox="0 0 200 250">
            <line class="hangman-part base" x1="20" y1="230" x2="180" y2="230" />
            <line class="hangman-part poteau" x1="60" y1="230" x2="60" y2="40" />
            <line class="hangman-part traverse" x1="60" y1="40" x2="130" y2="40" />
            <line class="hangman-part corde" x1="130" y1="40" x2="130" y2="70" />
            <circle class="hangman-part tete" cx="130" cy="90" r="20" />
            <line class="hangman-part corps" x1="130" y1="110" x2="130" y2="160" />
            <line class="hangman-part bras-gauche" x1="130" y1="120" x2="100" y2="140" />
            <line class="hangman-part bras-droit" x1="130" y1="120" x2="160" y2="140" />
            <line class="hangman-part jambe-gauche" x1="130" y1="160" x2="110" y2="200" />
            <line class="hangman-part jambe-droite" x1="130" y1="160" x2="150" y2="200" />
          </svg>
        </div>

      </section>
    </div>
  </main>

  <script>
    const portal = document.getElementById('portal');
    document.querySelectorAll('[data-portal-link]').forEach(link => {
      link.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) {
          return;
        }
        if (!portal) {
          return;
        }
        event.preventDefault();
        portal.classList.add('is-active');
        setTimeout(() => {
          window.location.assign(link.href);
        }, 320);
      });
    });

    const INITIAL_STATE = {{ pendu_state|tojson }};
    const wordElement = document.getElementById('pendu-word');
    const attemptsElement = document.getElementById('pendu-attempts');
    const scoreElement = document.getElementById('pendu-score');
    const messageElement = document.getElementById('pendu-message');
    const lettersGrid = document.getElementById('letters-grid');
    const guessForm = document.getElementById('guess-form');
    const guessInput = document.getElementById('guess-input');
    const newGameButton = document.getElementById('new-game');
    const statusElement = document.getElementById('pendu-status');
    const hangmanParts = document.querySelectorAll('.hangman-part');

    function updateMessage(content, status) {
      messageElement.textContent = content || '';
      messageElement.className = 'message';
      if (!content) {
        messageElement.classList.remove('visible');
        return;
      }

      messageElement.classList.add('visible');
      if (status === 'won') {
        messageElement.classList.add('message--success');
      } else if (status === 'lost') {
        messageElement.classList.add('message--danger');
      } else {
        messageElement.classList.add('message--info');
      }
    }

    function updateHangmanDrawing(attemptsLeft, maxAttempts) {
      const errors = maxAttempts - attemptsLeft;
      hangmanParts.forEach((part, index) => {
        if (index < errors) part.classList.add('visible');
        else part.classList.remove('visible');
      });
    }

    function renderState(state, extraMessage) {
      state.max_attempts = 10;
      wordElement.textContent = state.masked_word;
      attemptsElement.textContent = `${state.remaining_attempts}/${state.max_attempts}`;
      scoreElement.textContent = state.score;

      lettersGrid.innerHTML = '';
      state.attempted_letters.forEach((letter) => {
        const pill = document.createElement('span');
        pill.classList.add('letter-pill');
        if (state.correct_letters.includes(letter)) pill.classList.add('correct');
        else if (state.incorrect_letters.includes(letter)) pill.classList.add('incorrect');
        pill.textContent = letter;
        lettersGrid.appendChild(pill);
      });

      updateHangmanDrawing(state.remaining_attempts, state.max_attempts);

      if (state.status === 'lost') {
        document.querySelector('.hangman-svg').classList.add('lost');
      } else {
        document.querySelector('.hangman-svg').classList.remove('lost');
      }

      let message = extraMessage || '';
      const revealedWord = state.solution || state.masked_word.replace(/\s/g, '');
      if (state.status === 'won') {
        message = `Bravo ! Tu as trouvé ${revealedWord} !`;
      } else if (state.status === 'lost') {
        message = `Raté... Le mot était ${revealedWord}.`;
      }

      updateMessage(message, state.status);
      if (statusElement) {
        const statusText = state.status === 'won'
          ? '🎉 Victoire'
          : state.status === 'lost'
            ? '💥 Défaite'
            : '';
        statusElement.textContent = statusText;
        statusElement.classList.toggle('visible', Boolean(statusText));
      }

      if (newGameButton) {
        newGameButton.classList.toggle('is-ready', state.status === 'won' || state.status === 'lost');
      }
    }

    async function submitGuess(letter) {
      const response = await fetch("{{ url_for('pendu_guess') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ letter })
      });
      const payload = await response.json();
      renderState(payload.state, payload.message);
    }

    async function startNewGame() {
      const response = await fetch("{{ url_for('pendu_new_game') }}", { method: 'POST' });
      const payload = await response.json();
      renderState(payload.state, 'Nouvelle partie !');
      guessInput.focus();
    }

    guessForm.addEventListener('submit', e => {
      e.preventDefault();
      const letter = (guessInput.value || '').trim();
      if (!letter) return;
      submitGuess(letter);
      guessInput.value = '';
      guessInput.focus();
    });

    if (newGameButton) {
      newGameButton.addEventListener('click', startNewGame);
    }

    renderState(INITIAL_STATE);
  </script>
</body>
</html>
