<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Partie en ligne – Puissance 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.95" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js" integrity="sha384-KA7m0DwgQGmeRC6Xre3hJO+ZxpanOauVh4Czdqbg8lDKJ3bZZYVYmP+y4F31x40L" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 30%, #1b2735, #090a0f 80%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f4f8;
      overflow: hidden;
      padding: 16px;
    }
    .container {
      width: min(92vw, 820px);
      padding: 28px;
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.5s ease;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: calc(100vh - 32px);
      overflow: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }
    .player-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-end;
    }
    .elos {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .elo-card {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
    }
    .elo-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(240,244,248,0.7);
    }
    .elo-card .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f0f4f8;
    }
    .elo-card .delta {
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 1.1rem;
    }
    .elo-card .delta.positive {
      color: #3ddc97;
    }
    .elo-card .delta.negative {
      color: #ff6b6b;
    }
    .elo-card .delta.neutral {
      color: rgba(240,244,248,0.65);
    }
    .elo-card.hidden {
      opacity: 0.4;
    }
    .color-badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.12);
    }
    .color-badge.rouge {
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.4);
    }
    .color-badge.jaune {
      color: #f4a261;
      border: 1px solid rgba(244, 162, 97, 0.4);
    }
    #status {
      font-size: 1rem;
      color: rgba(240, 244, 248, 0.9);
      min-height: 24px;
    }
    .board {
      width: min(640px, 85vw, calc(max(0px, 100vh - 220px) * 7 / 6));
      max-height: max(0px, calc(100vh - 220px));
      aspect-ratio: 7 / 6;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(6px, 1.2vw, 14px);
      padding: clamp(12px, 1.8vw, 22px);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: inset 0 8px 26px rgba(0,0,0,0.45);
      margin: 0 auto;
    }
    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9), 0 6px 18px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      overflow: hidden;
    }
    .cell:hover {
      transform: translateY(-4px);
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.85), 0 8px 20px rgba(30,144,255,0.18);
    }
    .cell.disabled {
      cursor: default;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9), 0 3px 10px rgba(0,0,0,0.25);
    }
    .cell.disabled:hover {
      transform: none;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9), 0 3px 10px rgba(0,0,0,0.25);
    }
    .token {
      position: absolute;
      inset: 2%;
      border-radius: 50%;
      background: transparent;
      opacity: 0;
      transform: translateY(0);
      transition: background 0.18s ease, box-shadow 0.18s ease, opacity 0.2s ease;
      pointer-events: none;
    }
    .token.visible {
      opacity: 1;
    }
    .token.rouge {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #e63946 65%);
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.45);
    }
    .token.jaune {
      background: radial-gradient(circle at 35% 30%, #ffd19a, #f4a261 65%);
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.45);
    }
      
    .token.drop {
      animation: descendre 0.32s ease-in forwards;
    }

    @keyframes descendre {
      from { transform: translateY(-420px); }
      to { transform: translateY(0); }
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .actions button, .actions a {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .actions button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }
    #reset {
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      color: #1b2735;
    }
    #reset:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
    #leave {
      background: linear-gradient(90deg, #ff5f6d, #ffc371);
      color: #1b2735;
    }
    #leave:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    a.back {
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      color: rgba(240,244,248,0.9);
    }
    a.back:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    .opponent {
      font-size: 0.95rem;
      color: rgba(240,244,248,0.75);
    }
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 24px;
        gap: 16px;
      }
      .meta {
        align-items: flex-start;
      }
      .elos {
        justify-content: flex-start;
      }
    }

    .token.victoire-rouge {
      animation: pulse-rouge 1s ease-in-out infinite alternate;
      box-shadow: 0 0 4px 2px rgba(255, 75, 75, 0.25), inset 0 4px 6px rgba(0,0,0,0.45);
      filter: brightness(1.05);
    }

    .token.victoire-jaune {
      animation: pulse-jaune 1s ease-in-out infinite alternate;
      box-shadow: 0 0 4px 2px rgba(255, 209, 102, 0.25), inset 0 4px 6px rgba(0,0,0,0.45);
      filter: brightness(1.05);
    }

    @keyframes pulse-rouge {
      from { transform: translateY(0) scale(1); filter: brightness(1.0); box-shadow: 0 0 3px 1px rgba(255, 75, 75, 0.2), inset 0 4px 6px rgba(0,0,0,0.45); }
      to   { transform: translateY(0) scale(1.05); filter: brightness(1.15); box-shadow: 0 0 6px 3px rgba(255, 75, 75, 0.35), inset 0 4px 6px rgba(0,0,0,0.45); }
    }

    @keyframes pulse-jaune {
      from { transform: translateY(0) scale(1); filter: brightness(1.0); box-shadow: 0 0 3px 1px rgba(255, 209, 102, 0.2), inset 0 4px 6px rgba(0,0,0,0.45); }
      to   { transform: translateY(0) scale(1.05); filter: brightness(1.15); box-shadow: 0 0 6px 3px rgba(255, 209, 102, 0.35), inset 0 4px 6px rgba(0,0,0,0.45); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="player-block">
        <h1>Bonjour {{ pseudo }}</h1>
        <div class="opponent" id="opponent"></div>
      </div>
      <div class="meta">
        <div class="info">
          <span>Votre couleur :</span>
          <span class="color-badge" id="color-badge">?</span>
        </div>
        <div class="elos">
          <div class="elo-card">
            <span class="label">Votre Elo</span>
            <span class="value" id="your-elo">-</span>
            <span class="delta" id="your-elo-delta"></span>
          </div>
          <div class="elo-card" id="opponent-elo-card">
            <span class="label">Elo adverse</span>
            <span class="value" id="opponent-elo">-</span>
            <span class="delta" id="opponent-elo-delta"></span>
          </div>
        </div>
      </div>
    </header>
    <div id="status">Connexion en cours…</div>
    <div class="board" id="board"></div>
    <div class="actions">
      <button id="reset">🔄 Réinitialiser (0/2)</button>
      <button id="leave" disabled>Quitter la partie</button>
      <a href="/lobby_multi" class="back">Retour au lobby</a>
    </div>
  </div>

  <script>
    const pseudo = {{ pseudo|tojson }};
    const roomId = {{ room_id|tojson }};
    const ROWS = 6;
    const COLS = 7;

    const socket = io();
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const opponentEl = document.getElementById('opponent');
    const colorBadge = document.getElementById('color-badge');
    const leaveBtn = document.getElementById('leave');
    const resetBtn = document.getElementById('reset');
    const yourEloEl = document.getElementById('your-elo');
    const yourEloDeltaEl = document.getElementById('your-elo-delta');
    const opponentEloEl = document.getElementById('opponent-elo');
    const opponentEloDeltaEl = document.getElementById('opponent-elo-delta');
    const opponentEloCard = document.getElementById('opponent-elo-card');

    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let myColor = null;
    let myTurn = false;
    let gameFinished = false;
    let opponent = null;
    let myElo = null;
    let opponentElo = null;
    let resetVotes = 0;
    let resetTotal = 2;
    let resetContext = 'reset';
    let hasResetVote = false;
    let canLeave = false;

    function setEloValue(valueEl, deltaEl, rating, delta) {
      if (valueEl) {
        if (typeof rating === 'number') {
          valueEl.textContent = Math.round(rating);
        } else if (rating) {
          valueEl.textContent = rating;
        } else {
          valueEl.textContent = '-';
        }
      }
      if (deltaEl) {
        deltaEl.textContent = '';
        deltaEl.classList.remove('positive', 'negative', 'neutral');
        if (typeof delta === 'number') {
          if (delta > 0) {
            deltaEl.textContent = `+${delta}`;
            deltaEl.classList.add('positive');
          } else if (delta < 0) {
            deltaEl.textContent = `${delta}`;
            deltaEl.classList.add('negative');
          } else {
            deltaEl.textContent = '0';
            deltaEl.classList.add('neutral');
          }
        }
      }
    }

    function updateResetButtonDisplay(votes = resetVotes, total = resetTotal, context = resetContext) {
      const baseLabel = context === 'rematch' ? '✨ Nouvelle partie' : '🔄 Réinitialiser';
      resetBtn.textContent = `${baseLabel} (${votes}/${total})`;
    }

    function updateLeaveButton() {
      leaveBtn.disabled = !canLeave;
    }

    updateResetButtonDisplay();
    updateLeaveButton();
    setEloValue(yourEloEl, yourEloDeltaEl, myElo, undefined);
    setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, undefined);
    opponentEloCard.classList.add('hidden');

    function buildBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell disabled';
          cell.dataset.row = row;
          cell.dataset.col = col;
          const token = document.createElement('div');
          token.className = 'token';
          cell.appendChild(token);
          boardEl.appendChild(cell);
        }
      }
    }

    function cloneBoardState(source) {
      return source.map(row => row.slice());
    }

    let previousBoard = cloneBoardState(board);
    let highlightedTokens = [];
    let animateDrops = false;

    function syncBoard(newBoard, { animate = false } = {}) {
      previousBoard = cloneBoardState(board);
      board = cloneBoardState(newBoard);
      animateDrops = animate;
    }

    function renderBoard() {
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const token = board[row][col];
          const idx = row * COLS + col;
          const cell = boardEl.children[idx];
          if (!cell) continue;

          if (!myTurn || gameFinished) {
            cell.classList.add('disabled');
          } else {
            cell.classList.remove('disabled');
          }

          const tokenEl = cell.querySelector('.token');
          if (!tokenEl) continue;

          if (token === 0) {
            tokenEl.className = 'token';
            continue;
          }

          tokenEl.classList.add('visible');
          tokenEl.classList.toggle('rouge', token === 1);
          tokenEl.classList.toggle('jaune', token === 2);

          if (animateDrops && previousBoard[row][col] === 0) {
            tokenEl.classList.remove('drop');
            // Force reflow to restart animation when necessary
            void tokenEl.offsetWidth;
            tokenEl.classList.add('drop');
            tokenEl.addEventListener('animationend', () => {
              tokenEl.classList.remove('drop');
            }, { once: true });
          }
        }
      }
      animateDrops = false;
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function updateColorBadge() {
      colorBadge.textContent = myColor ? (myColor === 'rouge' ? 'Rouge' : 'Jaune') : '?';
      colorBadge.className = `color-badge ${myColor || ''}`.trim();
    }

    boardEl.addEventListener('click', (event) => {
      if (!myTurn || gameFinished) return;
      const target = event.target.closest('.cell');
      if (!target) return;
      const column = Number(target.dataset.col);
      socket.emit('play_move', { room_id: roomId, column });
    });

    socket.on('connect', () => {
      socket.emit('pseudo', pseudo, () => {
        socket.emit('register_player', { room_id: roomId });
      });
    });

    function clearVictoryHighlight() {
      highlightedTokens.forEach(tokenEl => {
        tokenEl.classList.remove('victoire-rouge', 'victoire-jaune');
      });
      highlightedTokens = [];
    }

    function applyVictoryHighlight(coords, tokenValue) {
      clearVictoryHighlight();
      const className = tokenValue === 1 ? 'victoire-rouge' : 'victoire-jaune';
      coords.forEach(([row, col]) => {
        const idx = row * COLS + col;
        const cell = boardEl.children[idx];
        if (!cell) return;
        const tokenEl = cell.querySelector('.token');
        if (tokenEl && tokenEl.classList.contains('visible')) {
          tokenEl.classList.add(className);
          highlightedTokens.push(tokenEl);
        }
      });
    }

    function findVictoryCoords(state) {
      const directions = [
        [0, 1],
        [1, 0],
        [1, 1],
        [1, -1],
      ];

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const value = state[row][col];
          if (value === 0) continue;

          for (const [dr, dc] of directions) {
            const coords = [[row, col]];
            let r = row;
            let c = col;
            let count = 1;

            while (count < 4) {
              r += dr;
              c += dc;
              if (r < 0 || r >= ROWS || c < 0 || c >= COLS) break;
              if (state[r][c] !== value) break;
              coords.push([r, c]);
              count += 1;
            }

            if (count === 4) {
              return { token: value, coords };
            }
          }
        }
      }

      return null;
    }

    socket.on('waiting_player', (data) => {
      myColor = data.color;
      opponent = null;
      opponentEl.textContent = 'En attente d\'un adversaire…';
      clearVictoryHighlight();
      syncBoard(data.board || board, { animate: false });
      myTurn = false;
      gameFinished = false;
      myElo = typeof data.your_elo === 'number' ? data.your_elo : myElo;
      opponentElo = null;
      setEloValue(yourEloEl, yourEloDeltaEl, myElo, undefined);
      setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, undefined);
      opponentEloCard.classList.add('hidden');
      resetVotes = 0;
      hasResetVote = false;
      resetContext = 'reset';
      resetTotal = data.total || resetTotal;
      updateResetButtonDisplay(0, resetTotal, resetContext);
      canLeave = true;
      updateLeaveButton();
      updateColorBadge();
      updateStatus("En attente d'un adversaire…");
      renderBoard();
    });

    socket.on('game_start', (data) => {
      myColor = data.color;
      opponent = data.opponent;
      opponentEl.textContent = `Adversaire : ${opponent}`;
      clearVictoryHighlight();
      syncBoard(data.board || board, { animate: false });
      myTurn = !!data.your_turn;
      gameFinished = false;
      myElo = typeof data.your_elo === 'number' ? data.your_elo : myElo;
      opponentElo = typeof data.opponent_elo === 'number' ? data.opponent_elo : opponentElo;
      setEloValue(yourEloEl, yourEloDeltaEl, myElo, undefined);
      setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, undefined);
      opponentEloCard.classList.toggle('hidden', !opponent);
      resetVotes = 0;
      hasResetVote = false;
      resetContext = 'reset';
      resetTotal = data.total || 2;
      updateResetButtonDisplay(0, resetTotal, resetContext);
      canLeave = false;
      updateLeaveButton();
      updateColorBadge();
      updateStatus(myTurn ? 'À vous de jouer !' : `Tour de ${opponent}…`);
      renderBoard();
    });

    socket.on('game_reset', (data) => {
      myColor = data.color;
      opponent = data.opponent || null;
      opponentEl.textContent = opponent ? `Adversaire : ${opponent}` : '';
      clearVictoryHighlight();
      syncBoard(data.board || board, { animate: false });
      myTurn = !!data.your_turn;
      gameFinished = false;
      myElo = typeof data.your_elo === 'number' ? data.your_elo : myElo;
      opponentElo = typeof data.opponent_elo === 'number' ? data.opponent_elo : opponentElo;
      setEloValue(yourEloEl, yourEloDeltaEl, myElo, undefined);
      setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, undefined);
      opponentEloCard.classList.toggle('hidden', !opponent);
      resetVotes = 0;
      hasResetVote = false;
      resetContext = 'reset';
      updateResetButtonDisplay(0, resetTotal, resetContext);
      canLeave = false;
      updateLeaveButton();
      updateColorBadge();
      if (opponent) {
        updateStatus(myTurn ? 'À vous de jouer !' : `Tour de ${data.next_turn}…`);
      } else {
        updateStatus("En attente d'un adversaire…");
      }
      renderBoard();
    });

    socket.on('move_played', (data) => {
      const shouldAnimate = typeof data.column === 'number';
      clearVictoryHighlight();
      syncBoard(data.board || board, { animate: shouldAnimate });
      if (!data.winner && !data.draw) {
        resetVotes = 0;
        hasResetVote = false;
        resetContext = 'reset';
        updateResetButtonDisplay(0, resetTotal, resetContext);
      }
      if (data.winner) {
        gameFinished = true;
        myTurn = false;
        const victory = data.winner === pseudo;
        resetContext = 'rematch';
        resetVotes = 0;
        hasResetVote = false;
        updateResetButtonDisplay(0, resetTotal, resetContext);
        canLeave = true;
        updateLeaveButton();
        if (data.forfeit) {
          if (victory) {
            updateStatus(`🏳️ ${data.forfeit} a abandonné. Victoire !`);
          } else if (data.forfeit === pseudo) {
            updateStatus('🏳️ Vous abandonnez la partie.');
          } else {
            updateStatus(`🏳️ ${data.forfeit} a abandonné la partie.`);
          }
        } else {
          updateStatus(victory ? '🎉 Vous gagnez la partie !' : `😢 ${data.winner} remporte la partie.`);
        }
      } else if (data.draw) {
        gameFinished = true;
        myTurn = false;
        resetContext = 'rematch';
        resetVotes = 0;
        hasResetVote = false;
        updateResetButtonDisplay(0, resetTotal, resetContext);
        canLeave = true;
        updateLeaveButton();
        updateStatus('🤝 Match nul !');
      } else {
        myTurn = data.next_turn === pseudo;
        updateStatus(myTurn ? 'À vous de jouer !' : `Tour de ${data.next_turn}…`);
        canLeave = false;
        updateLeaveButton();
      }
      if (data.result && data.result.ratings) {
        const ratings = data.result.ratings;
        const mine = ratings[pseudo];
        if (mine) {
          myElo = mine.after;
          setEloValue(yourEloEl, yourEloDeltaEl, myElo, mine.delta);
        }
        if (opponent && ratings[opponent]) {
          const other = ratings[opponent];
          opponentElo = other.after;
          setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, other.delta);
        }
      }
      renderBoard();
      if (data.winner) {
        const victory = findVictoryCoords(board);
        if (victory) {
          applyVictoryHighlight(victory.coords, victory.token);
        }
      }
    });

    socket.on('move_rejected', (data) => {
      if (data.message === 'column_full') {
        updateStatus('Cette colonne est pleine. Essayez une autre.');
      } else if (data.message === 'not_your_turn') {
        updateStatus("Patientez, c'est au tour de votre adversaire.");
      }
    });

    socket.on('reset_vote_update', (data) => {
      resetVotes = data && typeof data.votes === 'number' ? data.votes : 0;
      resetTotal = data && typeof data.total === 'number' ? data.total : resetTotal;
      resetContext = data && data.context ? data.context : resetContext;
      updateResetButtonDisplay(resetVotes, resetTotal, resetContext);
      if (resetVotes === 0) {
        hasResetVote = false;
        return;
      }

      if (resetVotes === resetTotal) {
        const pendingText = resetContext === 'rematch'
          ? 'Nouvelle partie en cours de préparation…'
          : 'Réinitialisation en cours…';
        updateStatus(pendingText);
        return;
      }

      if (hasResetVote) {
        const waitingText = resetContext === 'rematch'
          ? 'En attente de votre adversaire pour lancer la nouvelle partie…'
          : 'En attente de votre adversaire pour réinitialiser…';
        updateStatus(waitingText);
      } else {
        const promptText = resetContext === 'rematch'
          ? 'Votre adversaire souhaite lancer une nouvelle partie. Cliquez sur « Nouvelle partie » pour accepter.'
          : 'Votre adversaire souhaite réinitialiser la partie. Cliquez sur « Réinitialiser » pour accepter.';
        updateStatus(promptText);
      }
    });

    socket.on('room_error', (data) => {
      let message = 'Erreur inattendue.';
      let shouldLeave = true;
      if (data && data.message) {
        switch (data.message) {
          case 'not_enough_players':
            message = 'Vous devez être deux pour lancer ou réinitialiser la partie.';
            shouldLeave = false;
            break;
          case 'room_not_found':
            message = 'Salle introuvable.';
            break;
          case 'game_not_active':
            message = 'La partie n\'est pas active.';
            break;
          case 'identification_incomplete':
            message = 'Identification incomplète. Veuillez vous reconnecter.';
            break;
          default:
            message = `Erreur : ${data.message}`;
        }
      }
      updateStatus(message);
      if (shouldLeave) {
        setTimeout(() => {
          socket.emit('leave_multiplayer', { room_id: roomId });
        }, 1500);
      }
    });

    socket.on('opponent_left', (data) => {
      const name = data && data.pseudo ? data.pseudo : 'Votre adversaire';
      updateStatus(`${name} a quitté la partie.`);
      gameFinished = true;
      myTurn = false;
      opponent = null;
      opponentElo = null;
      setEloValue(opponentEloEl, opponentEloDeltaEl, opponentElo, undefined);
      opponentEloCard.classList.add('hidden');
      resetContext = 'rematch';
      resetVotes = 0;
      hasResetVote = false;
      updateResetButtonDisplay(0, resetTotal, resetContext);
      canLeave = true;
      updateLeaveButton();
      clearVictoryHighlight();
      renderBoard();
    });

    socket.on('left_room', () => {
      socket.disconnect();
      window.location.href = '/lobby_multi';
    });

    leaveBtn.addEventListener('click', () => {
      if (leaveBtn.disabled) return;
      socket.emit('leave_multiplayer', { room_id: roomId });
    });

    resetBtn.addEventListener('click', () => {
      if (hasResetVote) {
        return;
      }
      hasResetVote = true;
      const message = resetContext === 'rematch'
        ? 'Demande de nouvelle partie envoyée…'
        : 'Demande de réinitialisation envoyée…';
      updateStatus(message);
      socket.emit('reset_multiplayer', { room_id: roomId });
    });

    window.addEventListener('beforeunload', () => {
      socket.emit('leave_multiplayer', { room_id: roomId });
    });

    buildBoard();
    renderBoard();
  </script>
</body>
</html>
