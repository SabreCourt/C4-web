<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectateur – {{ joueur }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neo-arcade.css') }}" />
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/menu.js') }}" defer></script>
</head>
<body class="neo-arcade-page page-c4 theme-puissance4 spectator-view" data-pseudo="{{ session.get('pseudo', joueur) }}" data-active-page="jeux" data-game-id="c4_multi" data-audio-scene="puissance4">
  {% include 'partials/global_header.html' %}

  <header class="game-header neo-glass">
    <div class="game-header__meta">
      <h1>Mode spectateur</h1>
      <p>Observation en direct de la partie de {{ joueur }}.</p>
    </div>
  </header>

  <main class="game-main">
    <section class="spectator-shell">
      <article class="neo-card spectator-card">
        <h2>{{ joueur }}</h2>
        <p>Suivez chaque coup sans interrompre la partie.</p>
        <p id="info-spectateur" class="spectator-status">⏳ En attente de coups joués...</p>

        <div id="grille"></div>

        <div class="spectator-actions"></div>
      </article>
    </section>
  </main>

  <script>
    const socket = io();
    const joueurObserve = '{{ joueur }}';
    const grilleContainer = document.getElementById('grille');
    const info = document.getElementById('info-spectateur');

    const renderEmptyGrid = () => {
      grilleContainer.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        for (let j = 0; j < 7; j++) {
          const div = document.createElement('div');
          div.className = 'case';
          grilleContainer.appendChild(div);
        }
      }
    };

    renderEmptyGrid();

    socket.emit('spectateur', joueurObserve);

    socket.on('etat_grille', data => {
      if (!data || !Array.isArray(data.grille)) {
        return;
      }

      const grille = data.grille;
      grilleContainer.innerHTML = '';
      for (let i = 0; i < grille.length; i++) {
        for (let j = 0; j < grille[i].length; j++) {
          const div = document.createElement('div');
          div.className = 'case';
          if (grille[i][j] === 1) div.classList.add('rouge');
          if (grille[i][j] === 2) div.classList.add('jaune');
          grilleContainer.appendChild(div);
        }
      }
      info.textContent = '🎯 Partie en cours – mise à jour en direct.';
    });
  </script>
</body>
</html>
