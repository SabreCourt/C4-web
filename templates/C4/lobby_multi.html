<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lobby en ligne – Puissance 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neo-arcade.css') }}" />
</head>
<body class="neo-arcade-page page-c4 theme-puissance4">
  <div class="portal-transition" id="portal"></div>

  <header class="game-header neo-glass">
    <a class="game-header__brand" data-portal-link href="{{ url_for('menu') }}">⬅️ Hub</a>
    <div class="game-header__meta">
      <h1>Puissance 4</h1>
      <p>Rejoins une partie multijoueur.</p>
    </div>
    <div class="game-header__actions">
      <a class="neo-button secondary" data-portal-link href="{{ url_for('profile') }}">Profil</a>
    </div>
  </header>

  <main class="game-main">
    <section class="lobby-shell">
      <article class="neo-card lobby-card">
        <div class="lobby-card__body">
          <h2>Lobby en ligne</h2>
          <p>Sélectionne une salle disponible ou crée ton propre duel.</p>
          <p id="message" class="lobby-card__message" aria-live="polite"></p>
        </div>
        <div class="lobby-card__actions">
          <button id="create-room" class="neo-button primary">Créer une salle</button>
          <a class="neo-button tertiary" data-portal-link href="{{ url_for('lobby') }}">⬅️ Retour au lobby</a>
        </div>
        <div id="rooms" class="room-list" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script>
    const portal = document.getElementById('portal');
    document.querySelectorAll('[data-portal-link]').forEach(link => {
      link.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) {
          return;
        }
        if (!portal) {
          return;
        }
        event.preventDefault();
        portal.classList.add('is-active');
        setTimeout(() => {
          window.location.assign(link.href);
        }, 320);
      });
    });

    const pseudo = {{ pseudo|tojson }};
    const messageEl = document.getElementById('message');
    const roomsEl = document.getElementById('rooms');
    const createButton = document.getElementById('create-room');

    async function fetchRooms() {
      try {
        const response = await fetch('/api/rooms');
        if (!response.ok) {
          throw new Error('Erreur lors de la récupération des parties.');
        }
        const data = await response.json();
        handleRooms(data.rooms || []);
      } catch (error) {
        messageEl.textContent = error.message || 'Erreur inattendue.';
      }
    }

    function handleRooms(rooms) {
      const myRoom = rooms.find(room => room.players.includes(pseudo));
      if (myRoom) {
        window.location.href = `/multi/${myRoom.id}`;
        return;
      }

      const availableRooms = rooms.filter(room => room.status === 'waiting' && room.players.length === 1 && room.host !== pseudo);
      renderRooms(availableRooms);
    }

    function renderRooms(list) {
      roomsEl.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'room-empty';
        empty.textContent = 'Aucune partie disponible pour le moment.';
        roomsEl.appendChild(empty);
        return;
      }

      list.forEach(room => {
        const item = document.createElement('div');
        item.className = 'room-item';

        const details = document.createElement('div');
        details.className = 'room-details';
        details.innerHTML = `<strong>${room.host}</strong><div class="room-meta">1/2 joueurs</div>`;

        const joinButton = document.createElement('button');
        joinButton.className = 'neo-button secondary';
        joinButton.type = 'button';
        joinButton.textContent = 'Rejoindre';
        joinButton.addEventListener('click', () => joinRoom(room.id));

        item.appendChild(details);
        item.appendChild(joinButton);
        roomsEl.appendChild(item);
      });
    }

    async function joinRoom(roomId) {
      try {
        const response = await fetch(`/api/rooms/${roomId}/join`, { method: 'POST' });
        const data = await response.json();
        if (!response.ok) {
          if (data && data.error === 'already_in_room' && data.room_id) {
            window.location.href = `/multi/${data.room_id}`;
            return;
          }
          throw new Error(data.error || 'Impossible de rejoindre la partie.');
        }
        window.location.href = `/multi/${roomId}`;
      } catch (error) {
        messageEl.textContent = error.message || 'Erreur inattendue.';
      }
    }

    createButton.addEventListener('click', async () => {
      createButton.disabled = true;
      messageEl.textContent = '';
      try {
        const response = await fetch('/api/rooms', { method: 'POST' });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Impossible de créer la partie.');
        }
        window.location.href = `/multi/${data.room_id}`;
      } catch (error) {
        messageEl.textContent = error.message || 'Erreur inattendue.';
        createButton.disabled = false;
      }
    });

    fetchRooms();
    setInterval(fetchRooms, 5000);
  </script>
</body>
</html>
