<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lobby en ligne – Puissance 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 30%, #1b2735, #090a0f 80%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f4f8;
    }
    .container {
      width: 92%;
      max-width: 520px;
      padding: 36px 32px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.9rem;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: rgba(240, 244, 248, 0.8);
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(90deg, #1E90FF, #00c6ff);
      color: #031427;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      opacity: 0.93;
    }
    button:disabled {
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(240, 244, 248, 0.4);
    }
    .rooms {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      max-height: 260px;
      overflow-y: auto;
      box-shadow: inset 0 8px 22px rgba(0,0,0,0.35);
    }
    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
      gap: 12px;
    }
    .room-item:last-child {
      margin-bottom: 0;
    }
    .room-item strong {
      font-size: 1rem;
    }
    .room-meta {
      font-size: 0.85rem;
      color: rgba(240, 244, 248, 0.7);
    }
    .empty {
      text-align: center;
      color: rgba(240, 244, 248, 0.6);
      font-size: 0.95rem;
      padding: 24px 0;
    }
    .message {
      min-height: 22px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #ffd166;
    }
    a.back {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.95rem;
      text-decoration: none;
      color: rgba(240, 244, 248, 0.8);
    }
    a.back:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Parties en ligne</h1>
    <p class="subtitle">Choisis une partie disponible ou crée ta propre salle.</p>
    <div class="message" id="message"></div>
    <div class="actions">
      <button id="create-room">➕ Créer une partie</button>
    </div>
    <div class="rooms" id="rooms"></div>
    <a class="back" href="/lobby">⟵ Retourner au lobby</a>
  </div>

  <script>
    const pseudo = {{ pseudo|tojson }};
    const messageEl = document.getElementById('message');
    const roomsEl = document.getElementById('rooms');
    const createButton = document.getElementById('create-room');

    async function fetchRooms() {
      try {
        const response = await fetch('/api/rooms');
        if (!response.ok) {
          throw new Error('Erreur lors de la récupération des parties.');
        }
        const data = await response.json();
        handleRooms(data.rooms || []);
      } catch (error) {
        messageEl.textContent = error.message || 'Erreur inattendue.';
      }
    }

    function handleRooms(rooms) {
      const myRoom = rooms.find(room => room.players.includes(pseudo));
      if (myRoom) {
        window.location.href = `/multi/${myRoom.id}`;
        return;
      }

      const availableRooms = rooms.filter(room => room.status === 'waiting' && room.players.length === 1 && room.host !== pseudo);
      renderRooms(availableRooms);
    }

    function renderRooms(list) {
      roomsEl.innerHTML = '';
      if (!list.length) {
        roomsEl.innerHTML = '<div class="empty">Aucune partie disponible pour le moment.</div>';
        return;
      }

      list.forEach(room => {
        const item = document.createElement('div');
        item.className = 'room-item';
        const details = document.createElement('div');
        details.innerHTML = `<strong>${room.host}</strong><div class="room-meta">1/2 joueurs</div>`;

        const joinButton = document.createElement('button');
        joinButton.textContent = 'Rejoindre';
        joinButton.addEventListener('click', () => joinRoom(room.id));

        item.appendChild(details);
        item.appendChild(joinButton);
        roomsEl.appendChild(item);
      });
    }

    async function joinRoom(roomId) {
      try {
        const response = await fetch(`/api/rooms/${roomId}/join`, { method: 'POST' });
        const data = await response.json();
        if (!response.ok) {
          if (data && data.error === 'already_in_room' && data.room_id) {
            window.location.href = `/multi/${data.room_id}`;
            return;
          }
          throw new Error('Impossible de rejoindre la partie.');
        }
        window.location.href = `/multi/${data.room_id}`;
      } catch (error) {
        messageEl.textContent = error.message || 'Erreur lors de la tentative de rejoindre.';
      }
    }

    createButton.addEventListener('click', async () => {
      createButton.disabled = true;
      messageEl.textContent = '';
      try {
        const response = await fetch('/api/rooms', { method: 'POST' });
        const data = await response.json();
        if (!response.ok) {
          if (data && data.error === 'already_in_room' && data.room_id) {
            window.location.href = `/multi/${data.room_id}`;
            return;
          }
          throw new Error('Impossible de créer une nouvelle partie.');
        }
        window.location.href = `/multi/${data.room_id}`;
      } catch (error) {
        createButton.disabled = false;
        messageEl.textContent = error.message || 'Erreur lors de la création de la salle.';
      }
    });

    fetchRooms();
    setInterval(fetchRooms, 3500);
  </script>
</body>
</html>
